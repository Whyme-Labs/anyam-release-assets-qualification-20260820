name: Inspect published latent explainer

on:
  push:
    branches:
      - automation/kokoro-assets-20260911

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect page and media
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lively-vessel-ssw5.here.now'
          curl --fail --location --retry 4 "$BASE/" -o index.html
          echo '--- INDEX HTML ---'
          cat index.html
          echo
          echo '--- REFERENCED PATHS ---'
          grep -Eo '(src|href)="[^"]+"' index.html || true
          echo
          echo '--- VIDEO HEADERS ---'
          curl --fail --location --retry 4 -I "$BASE/latent-variable-models-kokoro.mp4" || true
          curl --fail --location --retry 4 "$BASE/latent-variable-models-kokoro.mp4" -o video.mp4
          echo '--- FFPROBE ---'
          ffprobe -v error -show_format -show_streams video.mp4
          echo '--- ROOT LINKS CHECK ---'
          for p in captions.vtt captions.srt latent-variable-models-kokoro.srt latent_models_explainer_kokoro.srt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/$p" || true)
            echo "$p $code"
          done
