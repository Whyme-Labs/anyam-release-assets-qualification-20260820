name: Inspect published latent explainer

on:
  push:
    branches:
      - automation/kokoro-assets-20260911

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Inspect page, captions, and media
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lively-vessel-ssw5.here.now'
          curl --fail --location --retry 4 "$BASE/" -o index.html
          curl --fail --location --retry 4 "$BASE/captions.vtt" -o captions.vtt
          curl --fail --location --retry 4 "$BASE/latent-variable-models-kokoro.mp4" -o video.mp4

          echo '--- CAPTIONS VTT ---'
          cat captions.vtt
          echo
          echo '--- FFPROBE COMPACT ---'
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels,duration -of default=noprint_wrappers=1 video.mp4
          echo
          echo '--- SHA256 ---'
          sha256sum video.mp4 captions.vtt index.html
