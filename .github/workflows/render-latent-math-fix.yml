name: Render latent explainer Manim math fix

on:
  push:
    branches:
      - automation/kokoro-assets-20260911
    paths:
      - 'mathfix/**'
      - '.github/workflows/render-latent-math-fix.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/kokoro-assets-20260911

      - name: Install system rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg imagemagick \
            libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-science dvisvgm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Manim Community
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'manim==0.21.0'
          manim --version

      - name: Download the latest corrected Kokoro cut
        run: |
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://fancy-entry-jf5e.here.now/latent-variable-models-kokoro.mp4' \
            --output base.mp4
          ffprobe -v error -show_entries format=duration,size -of json base.mp4

      - name: Render transparent Manim scenes
        run: |
          mkdir -p mathfix/rendered
          for scene in \
            AEObjective \
            VAEReparameterization \
            ELBO \
            RateDistortion \
            VQNearest \
            StraightThrough \
            RQResidual \
            SAESparsity
          do
            echo "Rendering $scene"
            manim -qm -t --disable_caching --media_dir media mathfix/latent_math_scenes.py "$scene"
            src="$(find media -type f -name "${scene}.mov" -print -quit)"
            test -n "$src"
            cp "$src" "mathfix/rendered/${scene}.mov"
          done
          ls -lh mathfix/rendered

      - name: Composite, QC and publish to here.now
        run: |
          python mathfix/patch_and_publish.py --publish

      - name: Upload corrected master and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latent-models-manim-mathfix
          path: |
            mathfix/out/latent-variable-models-kokoro-mathfix.mp4
            mathfix/out/math_formula_contact_sheet.jpg
            mathfix/out/qc.json
            mathfix/out/publish_result.json
            mathfix/latent_math_scenes.py
          if-no-files-found: warn
          retention-days: 2
