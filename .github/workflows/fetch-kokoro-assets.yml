name: Fetch temporary Kokoro runtime assets

on:
  push:
    branches:
      - automation/kokoro-assets-20260911

permissions:
  contents: read

env:
  HF_REPO: hexgrad/Kokoro-82M

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Kokoro model, voice, config, and English spaCy model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/model/voices bundle/wheels

          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/${HF_REPO}/resolve/main/config.json?download=true" \
            --output bundle/model/config.json

          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/${HF_REPO}/resolve/main/kokoro-v1_0.pth?download=true" \
            --output bundle/model/kokoro-v1_0.pth

          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/${HF_REPO}/resolve/main/voices/am_liam.pt?download=true" \
            --output bundle/model/voices/am_liam.pt

          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" \
            --output bundle/wheels/en_core_web_sm-3.8.0-py3-none-any.whl

          test "$(stat -c%s bundle/model/kokoro-v1_0.pth)" -gt 300000000
          test "$(stat -c%s bundle/model/voices/am_liam.pt)" -gt 500000
          test "$(stat -c%s bundle/wheels/en_core_web_sm-3.8.0-py3-none-any.whl)" -gt 12000000

          (
            cd bundle
            sha256sum \
              model/config.json \
              model/kokoro-v1_0.pth \
              model/voices/am_liam.pt \
              wheels/en_core_web_sm-3.8.0-py3-none-any.whl \
              > SHA256SUMS.txt
          )
          cat bundle/SHA256SUMS.txt

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-runtime-assets
          path: bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
