name: Cancel insecure latent-video run

on:
  push:
    branches:
      - automation/herenow-latent-video-20260911
    paths:
      - .github/workflows/cancel-insecure-latent-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel public run before it can print an anonymous claim token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/34586696434/cancel"
